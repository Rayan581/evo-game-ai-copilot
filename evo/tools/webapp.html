<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="evo-token" content="__EVO_TOKEN__">
<title>EVO</title>
<style>
:root{
  --bg:#f8f6f2;--surface:#ffffff;--surface-2:#f2efe9;--ink:#1d1b18;--ink-2:#45413b;--muted:#6f685e;--line:#e5e0d6;--line-2:#d6cfc2;
  --accent:#b4502a;--accent-ink:#ffffff;--accent-soft:#f6e6dd;
  --good:#2b7a4b;--good-soft:#e2f1e7;--bad:#b3261e;--bad-soft:#f8e3e1;--warn:#8a5f00;--warn-soft:#f7ecd2;--info:#2a5fa8;--info-soft:#e3ecf8;
  --base-line:#7d766b;
  --s0:#2a78d6;--s1:#eb6834;--s2:#1baf7a;--s3:#eda100;--s4:#e87ba4;--s5:#008300;--s6:#6250d6;--s7:#e34948;
  --shadow:0 1px 2px rgba(30,25,15,.06),0 4px 16px rgba(30,25,15,.06);
  --radius:10px;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141311;--surface:#1d1b18;--surface-2:#24221e;--ink:#eeeae3;--ink-2:#cfc9bf;--muted:#a1998d;--line:#322e29;--line-2:#433e37;
  --accent:#e07a4f;--accent-ink:#1a0f09;--accent-soft:#3a251b;
  --good:#5cc086;--good-soft:#1b3326;--bad:#f07167;--bad-soft:#3d1f1c;--warn:#e0ad45;--warn-soft:#3a2f17;--info:#7aa7ea;--info-soft:#1c2a3e;
  --base-line:#a39b8f;
  --s0:#3987e5;--s1:#d95926;--s2:#199e70;--s3:#c98500;--s4:#d55181;--s5:#2e9b2e;--s6:#9085e9;--s7:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141311;--surface:#1d1b18;--surface-2:#24221e;--ink:#eeeae3;--ink-2:#cfc9bf;--muted:#a1998d;--line:#322e29;--line-2:#433e37;
  --accent:#e07a4f;--accent-ink:#1a0f09;--accent-soft:#3a251b;
  --good:#5cc086;--good-soft:#1b3326;--bad:#f07167;--bad-soft:#3d1f1c;--warn:#e0ad45;--warn-soft:#3a2f17;--info:#7aa7ea;--info-soft:#1c2a3e;
  --base-line:#a39b8f;
  --s0:#3987e5;--s1:#d95926;--s2:#199e70;--s3:#c98500;--s4:#d55181;--s5:#2e9b2e;--s6:#9085e9;--s7:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:30px;line-height:1.15}
h2{font-size:22px}
h3{font-size:17px}
code,.mono{font-family:var(--mono);font-size:.86em}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
/* layout */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.top .spacer{flex:1}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 57px)}
.side{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.side a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.side a:hover{background:var(--surface-2)}
.side a.on{background:var(--accent-soft);color:var(--accent)}
.side a .count{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:12px;padding:0 7px;font-weight:600}
.side .sep{height:1px;background:var(--line);margin:14px 6px}
.side svg{width:18px;height:18px;flex:none}
main{padding:28px clamp(16px,3vw,40px) 80px;max-width:1180px;width:100%;min-width:0}
.kv dd,.cfg > *{min-width:0;overflow-wrap:anywhere}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head p{margin:6px 0 0;color:var(--muted);max-width:68ch}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{margin-bottom:6px}
.card + .card{margin-top:16px}
.section{margin-top:30px}
.section > h2{margin-bottom:4px}
.section > .lead{color:var(--muted);margin:0 0 14px;max-width:72ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack > * + *{margin-top:10px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 5px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-muted{background:var(--surface-2);color:var(--muted)}
.p-accent{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-block;font-family:var(--mono);font-size:12px;padding:1px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);margin:2px 4px 2px 0;text-decoration:none;cursor:default}
a.chip{cursor:pointer}
a.chip:hover{border-color:var(--accent);color:var(--accent)}
.term{border-bottom:1px dotted var(--muted);cursor:help}
/* planner chip */
.planner{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.planner .d{width:8px;height:8px;border-radius:50%;background:var(--good)}
.planner .d.off{background:var(--muted)}
.planner .d.warn{background:var(--warn)}
.proj-select{max-width:260px}
/* next steps */
.next{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.next.first{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:linear-gradient(0deg,var(--surface),var(--surface)),var(--accent-soft);box-shadow:var(--shadow)}
.next .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.next h3{font-family:var(--sans);font-size:16px;font-weight:600}
.next p{margin:3px 0 10px;color:var(--muted)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--serif);font-size:28px;line-height:1.2;margin-top:2px}
.stat .s{font-size:12px;color:var(--muted)}
.meter{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:8px;display:flex}
.meter i{display:block;height:100%}
/* story */
.story{position:relative;padding-left:26px}
.story:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;margin-bottom:18px}
.ev:before{content:"";position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.ev.cyc:before{background:var(--accent);border-color:var(--accent)}
.ev.you:before{background:var(--info);border-color:var(--info)}
.ev .when{font-size:12px;color:var(--muted)}
.ev h3{font-family:var(--sans);font-size:15px;font-weight:600;margin:1px 0 6px}
.ev ul{margin:4px 0 0;padding-left:18px}
.ev li{margin:3px 0;color:var(--ink-2)}
.ev li.refused{color:var(--bad)}
.outcome{margin-top:8px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:14px}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
/* config rows */
.cfg{display:grid;grid-template-columns:minmax(170px,240px) minmax(0,1fr);gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.cfg:last-child{border-bottom:0}
.cfg .name{font-weight:600;display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.sw.base{background:transparent;border:2px dashed var(--base-line)}
.cfg .meta{font-size:13px;color:var(--muted);margin-top:2px}
.verdict-text{font-size:13px;margin-top:6px;color:var(--ink-2)}
/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.axis line,.axis path{stroke:var(--line-2)}
.gridline{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 9px;border-radius:7px;white-space:nowrap;z-index:5;box-shadow:var(--shadow);display:none}
.tip b{font-weight:600}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.legend button.offl{opacity:.4}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
/* decisions */
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--ink-2)}
.step.refused .no{background:var(--bad-soft);color:var(--bad)}
.step .say{font-weight:500}
.step .why{color:var(--muted);font-size:14px;margin-top:3px}
.step .gate{margin-top:6px;font-size:13px}
.step .gate.no{color:var(--bad)}
details{margin-top:6px}
details > summary{cursor:pointer;color:var(--muted);font-size:13px}
details > summary:hover{color:var(--ink)}
pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.45;max-height:420px;white-space:pre-wrap;word-break:break-word}
/* proposals */
.prop{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:18px;box-shadow:var(--shadow)}
.prop + .prop{margin-top:14px}
.prop .ask{font-size:17px;font-weight:600;margin:4px 0 8px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:14px;margin:10px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.callout{padding:12px 14px;border-radius:8px;background:var(--surface-2);font-size:14px;border:1px solid var(--line)}
.callout.info{background:var(--info-soft);border-color:transparent}
.callout.warn{background:var(--warn-soft);border-color:transparent}
.callout.bad{background:var(--bad-soft);border-color:transparent}
.callout.good{background:var(--good-soft);border-color:transparent}
/* flow */
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;counter-reset:f}
.flow div{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:13px;color:var(--muted)}
.flow b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}
.flow b:before{counter-increment:f;content:counter(f) ". ";color:var(--accent)}
.flow .mem{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
/* hypotheses */
.hyp{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.hyp + .hyp{margin-top:10px}
.life{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.life span{padding:2px 8px;border-radius:999px;background:var(--surface-2)}
.life span.on{background:var(--accent);color:var(--accent-ink)}
/* checklist */
.check{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .box{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;margin-top:1px}
.check.done .box{background:var(--good);border-color:var(--good);color:#fff}
.check.cur .box{border-color:var(--accent)}
.check.done .t{color:var(--muted)}
.check .t{font-weight:600}
.check .x{color:var(--muted);font-size:13px}
/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(10,8,5,.42);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer.wide{width:min(980px,100vw)}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:19px;flex:1}
.drawer .body{padding:18px;overflow:auto;flex:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;z-index:60;display:none;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.on{display:block}
.modal header{padding:18px 20px 0}
.modal .body{padding:8px 20px 20px}
.modal footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt + .opt{margin-top:8px}
.opt input{width:auto;margin-top:4px}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt .t{font-weight:600}
.opt .x{font-size:13px;color:var(--muted)}
.opt.dis{opacity:.55;cursor:not-allowed}
/* console */
.live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.spin{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.evline{font-size:13px;color:var(--muted);padding:3px 0;font-family:var(--mono)}
.thinking{display:flex;gap:10px;align-items:center;padding:12px;border:1px dashed var(--line-2);border-radius:10px;color:var(--muted);margin-top:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols .card{margin:0}
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100vw - 24px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;width:100%}
.toast.err{background:var(--bad);color:#fff}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--radius)}
.pop{position:absolute;z-index:90;max-width:300px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:var(--shadow);display:none}
.pop b{display:block;margin-bottom:3px}
.bottomnav{display:none}
.hide-sm{}
@media (max-width:980px){
  .g2,.g3{grid-template-columns:1fr}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:1fr}
}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:35;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:4px 0;position:relative}
  .bottomnav a.on{color:var(--accent)}
  .bottomnav svg{width:20px;height:20px}
  .bottomnav .count{position:absolute;top:0;right:calc(50% - 20px);background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:10px;padding:0 5px}
  main{padding:20px 16px 90px}
  .top{padding:8px 12px;gap:8px}
  .hide-sm{display:none !important}
  h1{font-size:25px}
  .cfg{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .planner .lbl{display:none}
}

/* v2: one-screen layout */
.shell{display:block;min-height:calc(100vh - 57px)}
main{margin:0 auto;padding:26px clamp(16px,3vw,32px) 90px;max-width:1120px}
.tabs{display:flex;gap:4px;margin-left:10px}
.tabs a{padding:7px 15px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:600}
.tabs a:hover{background:var(--surface-2)}
.tabs a.on{background:var(--accent-soft);color:var(--accent)}
.top .iconbtn{position:relative}
.top .iconbtn .count{position:absolute;top:-5px;right:-5px;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;padding:0 5px;font-weight:700}
.work{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.work > div > .card + .card, .work > div > .card + details{margin-top:16px}
.hello{margin:0 0 18px}
.hello h1{font-size:28px}
.hello p{margin:4px 0 0;color:var(--muted)}
.card.task{padding:22px}
.card.task h2{margin-bottom:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1.5px solid var(--line-2);border-radius:12px;padding:13px 15px;cursor:pointer;background:var(--surface);text-align:left;display:block;width:100%}
.mode:hover{border-color:var(--ink-2)}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mode b{display:block;font-size:15px}
.mode span{font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1.3fr 1fr .7fr;gap:10px;margin-top:14px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.startrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
.startrow select{width:auto;min-width:200px}
.btn.big{padding:11px 26px;font-size:16px;border-radius:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);margin-top:12px}
.chk input{width:auto}
.needs{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:linear-gradient(0deg,var(--surface),var(--surface))}
.needs h2{display:flex;align-items:center;gap:10px}
.needs h2 .pill{font-family:var(--sans)}
.prop2{padding:14px 0;border-top:1px solid var(--line)}
.prop2:first-of-type{border-top:0}
.prop2 .ask{font-weight:600;font-size:16px}
.prop2 .why{color:var(--muted);font-size:14px;margin:3px 0 8px}
.prop2 .row{margin-top:6px}
.prop2 input{max-width:260px;padding:6px 9px;font-size:13px}
.sess-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.sess-head h2{flex:1;font-size:19px}
.cols .card{box-shadow:none}
.recap{font-size:14px;color:var(--ink-2);margin:0 0 6px;padding:0;list-style:none}
.recap li{margin:2px 0}
details.earlier{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0}
details.earlier > summary{padding:12px 16px;list-style:none;display:flex;gap:10px;align-items:center}
details.earlier > summary::-webkit-details-marker{display:none}
details.earlier > summary:before{content:"▸";color:var(--muted)}
details.earlier[open] > summary:before{content:"▾"}
details.earlier .inner{padding:0 16px 14px}
.stand .big-q{font-family:var(--serif);font-size:20px;line-height:1.3;margin:2px 0 8px}
.mini{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}
.drawer .g2{grid-template-columns:1fr}
.step .gate.gbad{color:var(--bad);font-weight:500}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sub{font-size:13px;color:var(--muted)}
@media (max-width:980px){.work{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .tabs{display:none}
  .modes{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .bottomnav{grid-template-columns:repeat(4,1fr)}
  .startrow select{width:100%}
  .startrow .btn.big{width:100%;justify-content:center}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="dot"></span>EVO</a>
  <select id="projSel" class="proj-select hide-sm" aria-label="Project"></select>
  <nav class="tabs" id="tabs"></nav>
  <span class="spacer"></span>
  <button class="iconbtn" id="helpBtn" title="How EVO works" aria-label="How EVO works"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg></button>
  <button class="iconbtn" id="memBtn" title="What EVO remembers" aria-label="Memory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></button>
  <button class="iconbtn" id="setBtn" title="Settings and demo tools" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  <button class="iconbtn" id="themeBtn" title="Switch light / dark" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>
<div class="shell"><main id="view"><div class="empty">Loading…</div></main></div>
<nav class="bottomnav" id="bottomnav"></nav>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-live="polite"><header><h2 id="drawerTitle"></h2><button class="iconbtn" id="drawerClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div class="body" id="drawerBody"></div></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast-wrap" id="toasts"></div>
<div class="pop" id="pop"></div>
<script>
"use strict";
const TOKEN = document.querySelector('meta[name="evo-token"]').content;
const S = {projects: [], onboarding: [], settings: null, pid: null, page: "work", data: null, version: null,
           job: null, jobPoll: null, curveMode: "mean", hidden: new Set(), drawer: null, drawerFn: null, open: new Set(),
           task: {mode: "review", param: "", value: "", seeds: "3", note: "", provider: null, compare: false}};
const $ = (s, el = document) => el.querySelector(s);
const esc = v => (v === null || v === undefined ? "" : String(v)).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = (v, d = 1) => v === null || v === undefined || isNaN(v) ? "–" : Number(v).toFixed(d).replace("-", "−");
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + "s")}`;

/* ---------- glossary ---------- */
const GLOSS = {
  baseline: ["Baseline", "The project's default PPO settings. Every other config is judged against it."],
  seed: ["Seed", "One training run with a different random start. RL results vary a lot between seeds, so one good seed proves little."],
  config: ["Config", "A set of hyperparameters, written as the change from the baseline (e.g. learning_rate=0.003). Its seeds are grouped together."],
  cycle: ["Review cycle", "One pass of EVO: read new results, analyse them, then the planner picks actions one at a time (up to 8) and the cycle ends. The program then exits; the next cycle starts from evo.db."],
  hypothesis: ["Hypothesis", "A claim EVO writes into memory so a later cycle can test it, e.g. 'learning_rate=0.003 beats the baseline'. It stays open until you approve closing it."],
  gate: ["Policy gate", "Plain code that checks every action the planner picks: inside the approved search space, within budget, citing evidence that exists, not repeating rejected ideas. Refused actions change nothing."],
  ci: ["95% interval", "The range the true difference probably lies in, from bootstrapping the seeds. If it includes zero, EVO says it can't tell yet."],
  memory: ["Memory", "Everything in evo.db: approved facts, runs and score versions, hypotheses, lessons, your approvals and rejections, and every past decision. With memory off, the planner sees only this cycle's run folders."],
  proposal: ["Proposal", "Something EVO wants to do that needs you: launch runs, add seeds, close a hypothesis. Nothing happens until you approve."],
  lesson: ["Lesson", "A rule EVO learned (e.g. avoid learning_rate ≥ 0.003 because it collapsed). It steers future proposals; you can reject it."],
  planner: ["Planner", "Chooses EVO's next action. Either an LLM (via an OpenAI-compatible API) or the offline rules (deterministic, no API)."],
  score: ["Score", "Mean evaluation return over the last 5 evaluations of a run. LunarLander counts ≥100 as reaching the target."],
};
const T = (k, label) => `<span class="term" data-term="${k}">${esc(label || GLOSS[k][0].toLowerCase())}</span>`;

/* ---------- icons ---------- */
const IC = {};
const icon = k => "";
const PAGES = [["work", "Work"], ["results", "Results"]];

/* ---------- api ---------- */
async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-EVO-Token": TOKEN}, body: JSON.stringify(body)};
  let r;
  try { r = await fetch(path, opt); } catch (e) { throw new Error("Can't reach the EVO server. Is `evo serve` still running?"); }
  const j = await r.json().catch(() => ({error: "bad response"}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), err ? 7000 : 4200);
}
async function doAct(action, body, opts = {}) {
  try {
    const r = await api(`/api/p/${encodeURIComponent(S.pid)}/${action}`, body || {});
    if (r.message) toast(r.message, r.ok === false);
    await refresh(true);
    return r;
  } catch (e) { toast(e.message, true); }
}

/* ---------- theme ---------- */
function setTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); try { t ? localStorage.setItem("evo-theme", t) : localStorage.removeItem("evo-theme"); } catch (e) {} if (S.data) drawCharts(); }
try { const t = localStorage.getItem("evo-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  setTheme(dark ? "light" : "dark");
};

/* ---------- routing ---------- */
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const pid = parts[0] ? decodeURIComponent(parts[0]) : null;
  let page = (parts[1] || "work").split("#")[0];
  if (page === "home") page = "work";
  if (!PAGES.some(p => p[0] === page)) page = "work";
  return {pid, page};
}
function go(page) { location.hash = `#/${encodeURIComponent(S.pid)}/${page}`; }
window.addEventListener("hashchange", () => boot(false));

async function boot(first) {
  const r = route();
  if (first || !S.projects.length) {
    try {
      const p = await api("/api/projects");
      S.projects = p.projects; S.onboarding = p.onboarding; S.settings = p.settings;
    } catch (e) { $("#view").innerHTML = `<div class="callout bad">${esc(e.message)}</div>`; return; }
  }
  renderProjSel();
  if (!S.projects.length) { S.pid = null; S.data = null; renderNav(); renderOnboarding(); return; }
  const pid = r.pid && S.projects.some(p => p.project_id === r.pid) ? r.pid : S.projects[0].project_id;
  if (pid !== r.pid) { location.replace(`#/${encodeURIComponent(pid)}/${r.page}`); return; }
  const changed = pid !== S.pid;
  S.pid = pid; S.page = r.page;
  if (changed) { S.job = null; S.task.param = ""; }
  if (changed || !S.data) { S.data = null; await refresh(true); } else render();
  window.scrollTo(0, 0);
}

async function refresh(force) {
  if (!S.pid) return;
  try {
    const d = await api(`/api/p/${encodeURIComponent(S.pid)}`);
    S.data = d; S.settings = d.settings; S.version = null;
    render();
    if (d.job && d.job.status === "running" && !S.jobPoll) watchJob(d.job.id);
  } catch (e) { toast(e.message, true); }
}
async function pollVersion() {
  if (!S.pid || !S.data || document.hidden) return;
  try {
    const v = (await api(`/api/p/${encodeURIComponent(S.pid)}/version`)).version;
    if (S.version && v !== S.version) {
      const a = document.activeElement;
      const typing = a && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName) && ($("#view").contains(a) || $("#drawer").contains(a));
      if (!typing) await refresh(true); else return;
    }
    S.version = v;
  } catch (e) {}
}
setInterval(pollVersion, 2500);

/* ---------- chrome ---------- */
function renderProjSel() {
  const sel = $("#projSel");
  sel.innerHTML = S.projects.map(p => `<option value="${esc(p.project_id)}"${p.project_id === S.pid ? " selected" : ""}>${esc(p.name)}</option>`).join("")
    + `<option value="__new">+ Onboard a project…</option>`;
  sel.onchange = () => { if (sel.value === "__new") { renderOnboarding(); sel.value = S.pid || ""; } else location.hash = `#/${encodeURIComponent(sel.value)}/work`; };
  sel.style.display = S.projects.length ? "" : "none";
}
const shortModel = m => (m || "").split("/").pop();
function renderNav() {
  const has = !!S.pid;
  const n = S.data ? S.data.proposals.filter(p => p.status === "pending").length : 0;
  $("#tabs").innerHTML = has ? PAGES.map(([k, l]) => `<a href="#/${encodeURIComponent(S.pid)}/${k}" class="${S.page === k ? "on" : ""}">${l}${k === "work" && n ? ` <span class="pill p-accent">${n}</span>` : ""}</a>`).join("") : "";
  const sv = {work: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', results: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'};
  const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  $("#bottomnav").innerHTML = has ? PAGES.map(([k, l]) => `<a href="#/${encodeURIComponent(S.pid)}/${k}" class="${S.page === k ? "on" : ""}">${svg(sv[k])}<span>${l}</span>${k === "work" && n ? `<span class="count">${n}</span>` : ""}</a>`).join("")
    + `<a href="#" data-open="memory">${svg('<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>')}<span>Memory</span></a>`
    + `<a href="#" data-open="settings">${svg('<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>')}<span>Settings</span></a>` : "";
  ["helpBtn", "memBtn", "setBtn"].forEach(id => $("#" + id).style.display = has || id === "helpBtn" ? "" : "none");
  $("#bottomnav").querySelectorAll("[data-open]").forEach(a => a.onclick = e => { e.preventDefault(); a.dataset.open === "memory" ? openMemory() : openSettings(); });
}
$("#helpBtn").onclick = () => openHow();
$("#memBtn").onclick = () => openMemory();
$("#setBtn").onclick = () => openSettings();

/* ---------- helpers on data ---------- */
const D = () => S.data;
function groupLabel(ref) {
  const h = String(ref || "").replace(/^group:/, "");
  const g = D().groups.find(g => g.group.startsWith(h) || h.startsWith(g.group));
  return g ? g.label : h;
}
function groupByHash(h) { return D().groups.find(g => g.group === h); }
function colorOf(g) { return !g || g.is_baseline ? "var(--base-line)" : `var(--s${(g.slot || 0) % 8})`; }
function changeText(ch) { if (!ch || !Object.keys(ch).length) return "baseline"; return Object.entries(ch).map(([k, v]) => `${k}=${v}`).join(", "); }
function verdictPill(g) {
  if (g.is_baseline) return `<span class="pill p-muted">reference</span>`;
  const m = {better: ["p-good", "Better than baseline"], worse: ["p-bad", "Worse than baseline"], uncertain: ["p-warn", "Can't tell yet"], insufficient_seeds: ["p-muted", "Too few seeds"]};
  const [c, t] = m[g.verdict] || ["p-muted", "No verdict"];
  return `<span class="pill ${c}">${t}</span>`;
}
function verdictText(g) {
  const ms = D().project.min_seeds || 3;
  if (g.is_baseline) return `The reference every config is compared with. ${plural(g.n || 0, "finished seed")}.`;
  const d = g.diff_mean, ci = g.diff_ci95;
  if (g.verdict === "insufficient_seeds") return `Only ${plural(g.n || 0, "finished seed")}; EVO needs ${ms} before judging it${g.pending ? ` (${g.pending} more on the way)` : ""}.`;
  if (g.verdict === "uncertain") return `Averages ${fmt(d)} ${d >= 0 ? "above" : "below"} the baseline, but the seeds disagree: the 95% range [${fmt(ci && ci[0])}, ${fmt(ci && ci[1])}] includes zero.`;
  if (g.verdict === "better") return `Beats the baseline by ${fmt(d)} on average, and the 95% range [${fmt(ci[0])}, ${fmt(ci[1])}] stays above zero.`;
  if (g.verdict === "worse") return `Falls ${fmt(Math.abs(d))} below the baseline, and the 95% range [${fmt(ci[0])}, ${fmt(ci[1])}] stays below zero.`;
  return "Not analysed yet.";
}
function refChip(ref) {
  const [kind, ...rest] = String(ref).split(":"); const val = rest.join(":");
  const known = {run: () => D().curves.some(c => c.run === val), hyp: () => D().hypotheses.some(h => h.label === val), group: () => D().groups.some(g => g.group.startsWith(val) || val.startsWith(g.group))};
  let title = "";
  if (kind === "group") title = groupLabel(val);
  else if (kind === "kb") title = "knowledge note";
  else if (kind === "diag") title = "finding";
  else if (kind === "lesson") title = "lesson";
  else if (kind === "fact") title = "project fact";
  if (kind === "run" && known.run()) return `<a class="chip" data-run="${esc(val)}" title="Open run">${esc(ref)}</a>`;
  if (kind === "hyp" && known.hyp()) return `<a class="chip" data-mem="1" title="Open memory">${esc(ref)}</a>`;
  if (kind === "group" && known.group()) return `<span class="chip" title="${esc(ref)}">${esc("group:" + title)}</span>`;
  return `<span class="chip" title="${esc(title)}">${esc(ref)}</span>`;
}
function groupByPrefix(v) { const g = D().groups.find(g => g.group.startsWith(v) || v.startsWith(g.group)); return g ? g.group : v; }
const chips = refs => (refs || []).map(refChip).join("");
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return esc(iso);
  return d.toLocaleString(undefined, {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
}

/* plain-language narration of one planner step */
function narrate(d) {
  const a = d.arguments || {};
  const s = {
    search_knowledge: () => `Looked up its notes on “${esc(a.query)}”.`,
    inspect_run: () => `Opened run <b>${esc(a.run)}</b> to check its curve and log.`,
    compare_runs: () => `Compared every config against the baseline.`,
    open_hypothesis: () => `Wrote down a claim to test: “${esc(a.statement)}”`,
    propose_runs: () => `Asked you to approve ${plural(+a.seeds || 0, "new run")} of <b>${esc(changeText(a.change))}</b>${a.hypothesis ? ` to test ${esc(a.hypothesis)}` : ""}.`,
    request_seeds: () => `Asked you to approve ${plural(+a.seeds || 0, "more seed")} of <b>${esc(groupLabel(a.group))}</b>.`,
    resolve_hypothesis: () => `Proposed closing ${esc(a.hypothesis)} as <b>${esc(a.outcome)}</b>.`,
    ask_user: () => `Stopped to ask you: “${esc(a.question)}”`,
    end_cycle: () => `Finished the cycle.`,
  }[d.action];
  const txt = s ? s() : `${esc(d.action)} ${esc(JSON.stringify(a))}`;
  return d.allowed ? txt : `Tried: ${txt.replace(/^./, c => c.toLowerCase())}`;
}
function gateLine(d) {
  if (d.allowed) return `<div class="gate muted">✓ ${T("gate", "Gate")} allowed it.</div>`;
  return `<div class="gate no">✕ ${T("gate", "Gate")} refused it — nothing changed: ${esc((d.reasons || []).join("; "))}</div>`;
}
function stepHTML(d, opts = {}) {
  return `<div class="step ${d.allowed ? "" : "refused"}"><div class="no">${d.step}</div><div>
    <div class="say">${narrate(d)}</div>
    ${d.rationale ? `<div class="why">Why: ${esc(d.rationale)}</div>` : ""}
    ${d.evidence && d.evidence.length ? `<div style="margin-top:5px"><span class="tiny muted">Evidence </span>${chips(d.evidence)}</div>` : ""}
    ${gateLine(d)}
    ${opts.brief && d.brief ? `<details data-k="brief-${opts.cyc}-${d.step}"><summary>What the planner saw (its full briefing)</summary><pre>${esc(typeof d.brief === "string" ? d.brief : JSON.stringify(d.brief, null, 2))}</pre></details>` : ""}
    ${opts.meta ? `<div class="tiny muted" style="margin-top:4px">${esc(d.provider || "")}${d.model ? " · " + esc(shortModel(d.model)) : ""}${d.latency_ms ? ` · ${(d.latency_ms / 1000).toFixed(1)} s` : ""}</div>` : ""}
  </div></div>`;
}

/* ---------- render dispatch ---------- */
function render() {
  renderNav();
  if (!S.data) return;
  const v = $("#view");
  v.querySelectorAll("details[open][data-k]").forEach(d => S.open.add(d.dataset.k));
  v.innerHTML = S.page === "results" ? pageResults() : pageWork();
  v.querySelectorAll("details[data-k]").forEach(d => { if (S.open.has(d.dataset.k)) d.open = true; d.addEventListener("toggle", () => d.open ? S.open.add(d.dataset.k) : S.open.delete(d.dataset.k)); });
  wire(v);
  drawCharts();
  if (S.drawerFn && $("#drawer").classList.contains("on")) {
    const b = $("#drawerBody"), a = document.activeElement;
    if (!(a && b.contains(a) && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName))) {
      const y = b.scrollTop; b.querySelectorAll("details[open][data-k]").forEach(d => S.open.add(d.dataset.k));

/* ---- start a task ---- */
async function startTask() {

function bestGroup() {
  const gs = D().groups.filter(g => !g.is_baseline && g.mean !== null && g.mean !== undefined);

  const b = bestGroup();

        ${d.disk.corrections.length ? d.disk.corrections.map(c => `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><span class="mono small">${esc(c.run)}</span> <span class="tiny muted">← ${esc(c.file)}</span></div>${c.status ? statusPillP(c.status) : c.run_known ? `<button class="btn sm" data-corr="${esc(c.file)}">Apply</button>` : `<span class="tiny muted">run not read yet</span>`}</div>`).join("") : `<p class="small muted">No correction files in fixtures/corrections.</p>`}
        <label class="f" for="corrReason">Reason (stored with the new version)</label><input id="corrReason" value="eval used 3 episodes; re-scored with 20"></div>
      <div class="card" id="facts"><h3>Correct a project fact</h3><p class="small muted" style="margin:2px 0 4px">E.g. cut <code>run_budget</code> to 12. The gate uses the new value immediately; history is kept.</p>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><div><label class="f" for="fkey">Fact</label><select id="fkey">${d.fact_keys.map(k => `<option ${k === "run_budget" ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></div>
        <div><label class="f" for="fval">New value</label><input id="fval" placeholder="12"></div></div>
        <div class="tiny muted" id="fcur" style="margin-top:6px"></div>
        <label class="f" for="freason">Reason</label><input id="freason" placeholder="GPU budget cut">
        <button class="btn" style="margin-top:12px" id="fsave">Save new version</button></div>
    </div>
    <div>
      <div class="card"><h3>Planner</h3><p class="small muted" style="margin:2px 0 8px">Set in <code>config.yaml</code>; you can override the model here for this session.</p>
        <dl class="kv" style="grid-template-columns:110px 1fr"><dt>Default</dt><dd>${s.provider === "openai_compat" ? "LLM" : "Offline rules"}</dd><dt>Model</dt><dd><code>${esc(s.model)}</code></dd><dt>Endpoint</dt><dd>${esc(s.host || "–")}</dd><dt>API key</dt><dd>${s.key_present ? '<span class="pill p-good">found in .env</span>' : '<span class="pill p-warn">missing</span> <span class="tiny muted">put EVO_LLM_API_KEY in .env</span>'}</dd><dt>Steps/cycle</dt><dd>${s.max_steps}</dd></dl>
        <label class="f" for="mdl">Model for this session</label><div class="row" style="flex-wrap:nowrap"><input id="mdl" value="${esc(s.overrides.model || "")}" placeholder="${esc(s.model)}" list="mdls"><button class="btn" id="mdlSave">Use</button></div>
        <datalist id="mdls"><option value="openai/gpt-oss-120b"><option value="openai/gpt-oss-20b"></datalist></div>
      <div class="card"><h3>Approved runs</h3><p class="small muted" style="margin:2px 0 8px">What happens when you approve a run proposal.</p>
        <label class="opt ${s.runner_mode === "fixture" ? "sel" : ""}"><input type="radio" name="rm" value="fixture" ${s.runner_mode === "fixture" ? "checked" : ""}><div><div class="t">Replay prepared real runs</div><div class="x">Instant. Copies a matching real run from the fixture bank and labels it a replay. Best for the demo.</div></div></label>
        <label class="opt ${s.runner_mode === "live" ? "sel" : ""}"><input type="radio" name="rm" value="live" ${s.runner_mode === "live" ? "checked" : ""}><div><div class="t">Train for real</div><div class="x">Starts Stable-Baselines3 training in the background (minutes per run).</div></div></label></div>
      <div class="card"><h3>Demo data</h3><p class="small muted" style="margin:2px 0 8px">Prepared real runs you can drop into the project's runs folder.</p>
        ${d.disk.fixture_sets.map(f => `<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--line)"><div><b>${esc(f.name)}</b> <span class="tiny muted">${f.runs.length} runs</span></div>${f.staged ? '<span class="pill p-good">added</span>' : `<button class="btn sm" data-act="stage:${esc(f.name)}">Add</button>`}</div>`).join("") || `<p class="small muted">None.</p>`}
        <p class="tiny muted" style="margin:8px 0 0">Your own runs go in <code>${esc(d.project.id ? "" : "")}projects/${esc(d.project.id)}/runs/</code>.</p></div>
      <div class="card flat"><h3>Database</h3><p class="tiny muted mono" style="margin:4px 0 0;word-break:break-all">${esc(s.db)}</p></div>
    </div>
  </div>`;
}
document.addEventListener("click", e => {
  const c = e.target.closest("[data-corr]"); if (c) { c.disabled = true; doAct("correct-metric", {file: c.dataset.corr, reason: ($("#corrReason") || {}).value}); return; }
  if (e.target.id === "fsave") { doAct("correct-fact", {key: $("#fkey").value, value: $("#fval").value, reason: $("#freason").value}); return; }
  if (e.target.id === "mdlSave") { settingsSave({model: $("#mdl").value}); return; }
});
document.addEventListener("change", e => {
  if (e.target.name === "rm") settingsSave({runner_mode: e.target.value});
  if (e.target.id === "fkey") showFactCur();
});
document.addEventListener("focusin", e => { if (e.target.id === "fval") showFactCur(); });
function showFactCur() { const k = $("#fkey").value; const v = D().facts_current[k]; $("#fcur").textContent = "Current: " + (typeof v === "object" ? JSON.stringify(v) : v); }
async function settingsSave(b) {
  try { const r = await api("/api/settings", b); S.settings = r.settings; toast("Settings updated for this session."); await refresh(true); } catch (e) { toast(e.message, true); }
}


function openDrawerFn(title, fn, wide) { openDrawer(title, fn(), wide); S.drawerFn = fn; }
function openMemory() { openDrawerFn("What EVO remembers", memoryBody, false); }
function openSettings() { openDrawerFn("Settings and demo tools", settingsBody, false); }

/* ---------- onboarding ---------- */
function renderOnboarding() {
  renderNav();
  const list = S.onboarding;
  $("#view").innerHTML = `<div class="page-head"><div><div class="eyebrow">Welcome</div><h1>Start a project</h1><p>EVO reads a project's <code>project.yaml</code> once. You approve the facts it extracts (goal, baseline, search space, budget), and from then on everything lives in <code>evo.db</code>.</p></div></div>
    ${list.map(o => `<div class="card"><div class="row between"><div><h3>${esc(o.name || o.file)}</h3><div class="small muted">${esc(o.env || "")} · ${esc(o.algo || "")} · <code>${esc(o.file)}</code></div></div>${o.onboarded ? '<span class="pill p-good">onboarded</span>' : `<button class="btn primary" data-onb="${esc(o.file)}">Review facts</button>`}</div>${o.goal ? `<p class="small" style="margin:8px 0 0">${esc(o.goal)}</p>` : ""}${o.error ? `<div class="callout bad">${esc(o.error)}</div>` : ""}</div>`).join("") || `<div class="empty">No projects/*/project.yaml found.</div>`}`;
  $("#view").querySelectorAll("[data-onb]").forEach(b => b.onclick = () => onboardDialog(b.dataset.onb));
}
function onboardDialog(file) {
  const o = S.onboarding.find(x => x.file === file);
  openModal(`<header><h2>Approve the facts for ${esc(o.project_id)}?</h2><p class="small muted">Extracted from <code>${esc(file)}</code>. These become version 1 of the project's facts.</p></header>
    <div class="body"><div class="scroll-x"><table class="tbl"><tbody>${Object.entries(o.facts).map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td class="small">${esc(typeof v === "object" ? JSON.stringify(v) : v)}</td></tr>`).join("")}</tbody></table></div></div>
    <footer><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="onbGo">Approve and onboard</button></footer>`);
  $("#onbGo").onclick = async () => {
    try { const r = await api("/api/onboard", {file}); toast(r.message); closeModal(); S.projects = []; location.hash = `#/${encodeURIComponent(r.project)}/work`; boot(true); } catch (e) { toast(e.message, true); }
  };
}

/* ---------- modal / drawer ---------- */
function openModal(html) { $("#modal").innerHTML = html; $("#modal").classList.add("on"); $("#scrim").classList.add("on"); S.modal = true; }
function closeModal() { $("#modal").classList.remove("on"); if (!S.drawer) $("#scrim").classList.remove("on"); S.modal = false; }
function openDrawer(title, html, wide) { S.drawerFn = null; $("#drawerTitle").textContent = title; $("#drawerBody").innerHTML = html; $("#drawer").classList.toggle("wide", !!wide); $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); wire($("#drawerBody")); }
function closeDrawer() { $("#drawer").classList.remove("on"); S.drawer = null; S.drawerFn = null; if (!S.modal) $("#scrim").classList.remove("on"); }
$("#drawerClose").onclick = closeDrawer;
$("#scrim").onclick = () => { if (S.modal) closeModal(); else closeDrawer(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (S.modal) closeModal(); else closeDrawer(); } });

function openHow() {
  openModal(`<header><h2>How EVO works</h2></header><div class="body">
    <p>You train RL agents (here: PPO on LunarLander) and get a pile of run folders. EVO is the assistant that keeps track: it reads the results, works out what they really show, remembers what was tried, and proposes the next experiment. <b>You approve; it never spends compute on its own.</b></p>
    <div class="flow" style="grid-template-columns:1fr">
      <div><b>Read</b>New run folders: config, scores, logs. Each file is hashed.</div>
      <div><b>Analyse</b>Plain code groups seeds by config and compares each with the baseline (bootstrap 95% interval).</div>
      <div class="mem"><b>Brief</b>A briefing is built from memory: facts, hypotheses, lessons, your past decisions and rejections.</div>
      <div><b>Decide</b>The planner (LLM or offline rules) picks ONE action and must cite evidence.</div>
      <div><b>Gate</b>Code checks it: search space, budget, real evidence, no repeats of rejected ideas. It can refuse.</div>
      <div><b>Act</b>Allowed actions run. Anything that costs compute becomes a proposal for you.</div>
      <div class="mem"><b>Save</b>Every step is written to evo.db. Repeat up to 8 steps, then the cycle ends.</div></div>
    <p class="small muted" style="margin-top:14px">“Persistent memory” means the next cycle (a new process, maybe days later) starts from evo.db alone: it knows H1 is open, what you rejected, and which scores were corrected.</p>
    <p class="small muted">Words with a dotted underline (like ${T("seed")} or ${T("gate")}) explain themselves when you hover or tap them.</p></div>
    <footer><button class="btn primary" onclick="closeModal()">Got it</button></footer>`);
}

async function openRun(name) {
  openDrawer(name, `<div class="live"><span class="spin"></span>Loading run…</div>`);
  try {
    const r = (await api(`/api/p/${encodeURIComponent(S.pid)}/run/${encodeURIComponent(name)}`)).run;
    const sm = r.summary || {}; const c = D().curves.find(x => x.run === name) || {}; const g = groupByHash(c.group);
    const pts = (r.curve || []).filter(p => p.mean !== null);
    let svg = "";
    if (pts.length) { const W = 500, H = 160, L = 40, R = 8, Tt = 8, B = 20; const xs = pts.map(p => p.step), ys = pts.map(p => p.mean);
      const x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const X = v => L + v / (x1 || 1) * (W - L - R), Y = v => Tt + (1 - (v - y0) / ((y1 - y0) || 1)) * (H - Tt - B);
      svg = `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${niceTicks(y0, y1, 4).map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" class="gridline"/><text x="${L - 5}" y="${Y(t) + 4}" text-anchor="end">${fmt(t, 0)}</text>`).join("")}<path d="${pts.map((p, i) => `${i ? "L" : "M"}${X(p.step)},${Y(p.mean)}`).join("")}" fill="none" stroke="${colorOf(g)}" stroke-width="2"/></svg></div>`; }
    $("#drawerBody").innerHTML = `<div class="row">${statusPill(r.status)}<span class="small muted">seed ${esc(r.seed)} · ${esc(g ? g.label : "")} · score version ${esc(r.metric_version)}</span></div>
      <dl class="kv"><dt>${T("score", "Score")}</dt><dd><b>${fmt(sm.score)}</b></dd><dt>Evaluations</dt><dd>${esc(sm.n_evals)}</dd><dt>Flags</dt><dd>${(sm.flags || []).map(f => `<span class="pill p-warn">${esc(f)}</span>`).join(" ") || "none"}</dd><dt>Findings</dt><dd>${(r.diagnoses || []).map(x => diagPill(x.kind)).join(" ") || "none"}</dd></dl>
      ${svg}<h3 style="margin-top:14px">End of train.log</h3><p class="tiny muted">Shown as untrusted data, exactly as the planner receives it.</p><pre>${esc(r.log_tail || "")}</pre>`;
  } catch (e) { $("#drawerBody").innerHTML = `<div class="callout bad">${esc(e.message)}</div>`; }
}

/* ---------- glossary popover ---------- */
const pop = $("#pop");
function showPop(el) { const g = GLOSS[el.dataset.term]; if (!g) return; pop.innerHTML = `<b>${esc(g[0])}</b>${esc(g[1])}`; pop.style.display = "block";
  const r = el.getBoundingClientRect(); const left = Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 10);
  pop.style.left = Math.max(8, left) + "px"; pop.style.top = (window.scrollY + r.bottom + 6) + "px"; }
document.addEventListener("mouseover", e => { const t = e.target.closest(".term"); if (t) showPop(t); });
document.addEventListener("mouseout", e => { if (e.target.closest(".term")) pop.style.display = "none"; });
document.addEventListener("click", e => { const t = e.target.closest(".term"); if (t) { e.preventDefault(); showPop(t); } else if (!e.target.closest("#pop")) pop.style.display = "none"; });

boot(true);
</script>
</body>
